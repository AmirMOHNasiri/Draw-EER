name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The extension must work on all three platforms.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Builds the extension and checks that HarfBuzz loads in the extension
      # host and in the preview's worker, as bundled.
      - run: npm run build
      - run: npm run smoke -w packages/vscode
      # Completion, Quick Fixes and highlighting inside a real VS Code. Linux
      # runners have no display, so it runs under a virtual one there.
      - run: xvfb-run -a npm run test:integration -w packages/vscode
        if: runner.os == 'Linux'
      - run: npm run test:integration -w packages/vscode
        if: runner.os != 'Linux'
      # The real preview page in headless Chrome (preinstalled on the Linux runners).
      - run: node packages/vscode/scripts/webview-check.mjs --require
        if: runner.os == 'Linux'
